version: 2

project_name: cage

builds:
  - id: cage
    main: .
    binary: cage
    env:
      - CGO_ENABLED=1
      - GOFLAGS=-mod=readonly
    flags:
      - -buildvcs=false
      - -trimpath
    mod_timestamp: "0"
    goos:
      - darwin
    goarch:
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: cage
    ids:
      - cage
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info:
      owner: root
      group: root
      mtime: "1970-01-01T00:00:00Z"
    files:
      - src: README.md
        info: &archive_file_info
          owner: root
          group: root
          mode: 0644
          mtime: "1970-01-01T00:00:00Z"
      - src: LICENSE
        info: *archive_file_info
      - src: examples/config.toml
        info: *archive_file_info
      - src: docs/man/cage.1
        info: *archive_file_info
      - src: internal/cage/launchd/co.2h2d.cage.cache-prune.plist.tmpl
        info: *archive_file_info

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  disable: true
