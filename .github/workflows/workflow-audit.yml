name: Workflow audit

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: workflow-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  online-audit:
    name: Online workflow audit
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Zizmor
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.10.18"
          install_args: --locked zizmor
          cache: false

      # Zizmor's online audits query GitHub for impostor commits, known-vulnerable actions,
      # stale action pins and ambiguous refs.
      - name: Audit workflows online
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
        run: zizmor --no-progress --pedantic --no-ignores --strict-collection .
