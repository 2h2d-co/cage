name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: go-release
  cancel-in-progress: false

permissions: {}

env:
  MISE_LOCKED: "1"

jobs:
  build:
    name: Validate prepared release artifacts
    runs-on: ubuntu-latest
    permissions:
      actions: read # Required to inspect and download the signed preparation artifact.
      contents: read
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate signed release commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! $GITHUB_REF_NAME =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "release tags must contain a semantic version" >&2
            exit 1
          fi
          base_version=${BASH_REMATCH[1]}
          if [[ $(git cat-file -t "refs/tags/$GITHUB_REF_NAME") != commit ]]; then
            echo "release tag $GITHUB_REF_NAME must be a lightweight tag" >&2
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")
          if [[ $tag_commit != "$GITHUB_SHA" ]]; then
            echo "release tag $GITHUB_REF_NAME does not point to workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "release tag $GITHUB_REF_NAME does not point to a commit on origin/main" >&2
            exit 1
          fi
          subject=$(git log -1 --pretty=%s "$tag_commit")
          if [[ $subject != "release: $GITHUB_REF_NAME" ]]; then
            echo "release commit subject $subject does not match release: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/.github/release-signers" \
            verify-commit "$tag_commit"
          expected_digest=$(git log -1 \
            --format='%(trailers:key=Release-Manifest-SHA256,valueonly)' \
            "$tag_commit")
          source_sha=$(git log -1 \
            --format='%(trailers:key=Release-Source-SHA,valueonly)' \
            "$tag_commit")
          build_run_id=$(git log -1 \
            --format='%(trailers:key=Release-Build-Run-ID,valueonly)' \
            "$tag_commit")
          prepared_artifact_id=$(git log -1 \
            --format='%(trailers:key=Release-Artifact-ID,valueonly)' \
            "$tag_commit")
          if [[ ! $expected_digest =~ ^[0-9a-f]{64}$ ]]; then
            echo "release commit is missing a valid Release-Manifest-SHA256 trailer" >&2
            exit 1
          fi
          if [[ ! $source_sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "release commit is missing a valid Release-Source-SHA trailer" >&2
            exit 1
          fi
          if [[ ! $build_run_id =~ ^[0-9]+$ || ! $prepared_artifact_id =~ ^[0-9]+$ ]]; then
            echo "release commit is missing valid preparation run and artifact trailers" >&2
            exit 1
          fi
          if [[ $(git rev-parse "$tag_commit^") != "$source_sha" ]]; then
            echo "release source must be the release commit's first parent" >&2
            exit 1
          fi
          if [[ $(git rev-parse "$tag_commit^{tree}") != $(git rev-parse "$source_sha^{tree}") ]]; then
            echo "release commit tree differs from the prepared release source" >&2
            exit 1
          fi
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/.github/release-signers" \
            verify-commit "$source_sha"
          prerelease=false
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            prerelease=true
          elif ! grep -Eq "^## \\[$base_version\\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated $base_version release section" >&2
            exit 1
          fi
          {
            echo "expected-digest=$expected_digest"
            echo "source-sha=$source_sha"
            echo "build-run-id=$build_run_id"
            echo "prepared-artifact-id=$prepared_artifact_id"
            echo "prerelease=$prerelease"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate prepared build
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.release.outputs.prepared-artifact-id }}
          BUILD_RUN_ID: ${{ steps.release.outputs.build-run-id }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.release.outputs.source-sha }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          test -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          workflow_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/prepare-release.yml" \
            --jq .id)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
          if [[ $(jq -r .workflow_id <<< "$run") != "$workflow_id" ||
                $(jq -r .event <<< "$run") != workflow_dispatch ||
                $(jq -r .head_branch <<< "$run") != main ||
                $(jq -r .head_sha <<< "$run") != "$SOURCE_SHA" ||
                $(jq -r .conclusion <<< "$run") != success ]]; then
            echo "signed preparation run does not describe a successful build of the release source" >&2
            exit 1
          fi
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")
          expected_name="go-release-${VERSION}-${SOURCE_SHA}"
          if [[ $(jq -r .name <<< "$artifact") != "$expected_name" ||
                $(jq -r .expired <<< "$artifact") != false ||
                $(jq -r .workflow_run.id <<< "$artifact") != "$BUILD_RUN_ID" ||
                $(jq -r .workflow_run.head_sha <<< "$artifact") != "$SOURCE_SHA" ]]; then
            echo "signed preparation artifact does not belong to the expected build" >&2
            exit 1
          fi

      - name: Download prepared release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.release.outputs.prepared-artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.build-run-id }}
          path: release-artifacts

      - name: Validate release artifacts
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.release.outputs.expected-digest }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          actual_digest=$(scripts/validate-release.sh "$VERSION" release-artifacts)
          if [[ $actual_digest != "$EXPECTED_DIGEST" ]]; then
            echo "release manifest digest $actual_digest does not match signed digest $EXPECTED_DIGEST" >&2
            exit 1
          fi

      - name: Upload release artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt
            release-artifacts/release-manifest.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      actions: read # Required to revalidate the signed preparation run and artifact.
      attestations: write # Required to persist release artifact attestations.
      contents: write # Required to create the GitHub release.
      id-token: write # Required for artifact attestation signing.
    timeout-minutes: 10
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifacts

      - name: Revalidate release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag_type=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq .object.type)
          tag_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq .object.sha)
          main_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/main" \
            --jq .object.sha)
          if [[ $tag_type != commit || $tag_sha != "$GITHUB_SHA" ]]; then
            echo "release tag $GITHUB_REF_NAME no longer points to workflow commit $GITHUB_SHA" >&2
            exit 1
          fi
          comparison=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/$tag_sha...$main_sha" \
            --jq .status)
          if [[ $comparison != identical && $comparison != ahead ]]; then
            echo "release commit $tag_sha is no longer an ancestor of main" >&2
            exit 1
          fi
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$tag_sha")
          verified=$(jq -r .verification.verified <<< "$commit")
          message=$(jq -r .message <<< "$commit")
          subject=${message%%$'\n'*}
          expected_digest=$(sed -n 's/^Release-Manifest-SHA256: //p' <<< "$message")
          source_sha=$(sed -n 's/^Release-Source-SHA: //p' <<< "$message")
          build_run_id=$(sed -n 's/^Release-Build-Run-ID: //p' <<< "$message")
          prepared_artifact_id=$(sed -n 's/^Release-Artifact-ID: //p' <<< "$message")
          if [[ $verified != true || $subject != "release: $GITHUB_REF_NAME" ]]; then
            echo "GitHub does not recognize the expected signed release commit" >&2
            exit 1
          fi
          if [[ ! $expected_digest =~ ^[0-9a-f]{64}$ ]]; then
            echo "release commit is missing a valid Release-Manifest-SHA256 trailer" >&2
            exit 1
          fi
          if [[ ! $source_sha =~ ^[0-9a-f]{40}$ ||
                ! $build_run_id =~ ^[0-9]+$ ||
                ! $prepared_artifact_id =~ ^[0-9]+$ ]]; then
            echo "release commit has invalid preparation trailers" >&2
            exit 1
          fi
          if [[ $(jq -r '.parents[0].sha' <<< "$commit") != "$source_sha" ]]; then
            echo "release source is no longer the release commit's first parent" >&2
            exit 1
          fi
          source_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$source_sha")
          if [[ $(jq -r .verification.verified <<< "$source_commit") != true ||
                $(jq -r .tree.sha <<< "$source_commit") != $(jq -r .tree.sha <<< "$commit") ]]; then
            echo "GitHub does not recognize the signed, tree-identical release source" >&2
            exit 1
          fi
          workflow_id=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/prepare-release.yml" \
            --jq .id)
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$build_run_id")
          if [[ $(jq -r .workflow_id <<< "$run") != "$workflow_id" ||
                $(jq -r .event <<< "$run") != workflow_dispatch ||
                $(jq -r .head_branch <<< "$run") != main ||
                $(jq -r .head_sha <<< "$run") != "$source_sha" ||
                $(jq -r .conclusion <<< "$run") != success ]]; then
            echo "signed preparation run no longer describes the expected successful build" >&2
            exit 1
          fi
          artifact=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$prepared_artifact_id")
          expected_name="go-release-${VERSION}-${source_sha}"
          if [[ $(jq -r .name <<< "$artifact") != "$expected_name" ||
                $(jq -r .expired <<< "$artifact") != false ||
                $(jq -r .workflow_run.id <<< "$artifact") != "$build_run_id" ||
                $(jq -r .workflow_run.head_sha <<< "$artifact") != "$source_sha" ]]; then
            echo "signed preparation artifact no longer belongs to the expected build" >&2
            exit 1
          fi

          cd release-artifacts
          archive="cage_${VERSION}_darwin_arm64.tar.gz"
          expected_files=$(printf '%s\n' \
            "$archive" \
            "checksums.txt" \
            "release-manifest.sha256")
          actual_files=$(find . -maxdepth 1 -type f -print | sed 's|^\./||' | LC_ALL=C sort)
          if [[ $actual_files != "$expected_files" ]]; then
            echo "release artifact contains unexpected files" >&2
            diff -u <(printf '%s\n' "$expected_files") <(printf '%s\n' "$actual_files") || true
            exit 1
          fi
          actual_digest=$(shasum -a 256 release-manifest.sha256 | awk '{print $1}')
          if [[ $actual_digest != "$expected_digest" ]]; then
            echo "release manifest digest $actual_digest does not match signed digest $expected_digest" >&2
            exit 1
          fi
          manifest_files=$(awk '{print $2}' release-manifest.sha256)
          expected_manifest_files=$(printf '%s\n' "checksums.txt" "$archive")
          if [[ $manifest_files != "$expected_manifest_files" ]]; then
            echo "release manifest does not contain the exact expected assets" >&2
            exit 1
          fi
          shasum -a 256 -c release-manifest.sha256
          shasum -a 256 "$archive" > "$RUNNER_TEMP/expected-checksums.txt"
          cmp "$RUNNER_TEMP/expected-checksums.txt" checksums.txt

          expected_archive_files=$(printf '%s\n' \
            "LICENSE" \
            "README.md" \
            "cage" \
            "docs/man/cage.1" \
            "examples/config.toml" \
            "internal/cage/launchd/co.2h2d.cage.cache-prune.plist.tmpl")
          actual_archive_files=$(tar -tzf "$archive" | LC_ALL=C sort)
          if [[ $actual_archive_files != "$expected_archive_files" ]]; then
            echo "$archive contains unexpected files" >&2
            exit 1
          fi

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt
            release-artifacts/release-manifest.sha256

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(
            release create "$GITHUB_REF_NAME"
            release-artifacts/*.tar.gz
            release-artifacts/checksums.txt
            release-artifacts/release-manifest.sha256
            --repo "$GITHUB_REPOSITORY"
            --generate-notes
            --verify-tag
          )
          if [[ $PRERELEASE == true ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
